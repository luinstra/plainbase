# Kotlin compiler daemon heap. The storage-revamp test source set (the ListResponseParser
# differential-oracle fuzz, the hybrid/concurrency/Q8/DR suites) is large enough to OOM the
# default daemon heap during test compilation. 3 GiB clears it with headroom and is safe on
# CI runners (linux 16 GiB, macOS native-gate compiles only the native-tagged subset).
kotlin.daemon.jvmargs=-Xmx3g
