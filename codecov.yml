coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
        removed_code_behavior: adjust_base
    patch:
      behavior:
        target: 80%
        threshold: 0%
        informational: true
        only_pulls: true
        paths:
          - "server/src/main/kotlin"
          - "!server/src/main/kotlin/com/plainbase/Application.kt"
          - "!server/src/main/kotlin/com/plainbase/frameworks/ktor/KtorServer.kt"

ignore:
  - "server/build/generated/sqldelight/**"
  - "server/src/main/kotlin/com/plainbase/Application.kt"

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  # Comment on a real coverage DROP only. `uncovered_patch` also fired whenever a patch had any uncovered
  # line at all, and Codecov renders that as a red X regardless of the configured target - so a patch at
  # 95.9% against an 80% bar got the same ❌ as a failure, on a status that is `informational: true` and
  # cannot gate anything. A red mark that never means "blocked" is one people learn to scroll past, which
  # costs us the one that would.
  require_changes: "coverage_drop"
  require_base: true
  require_head: true
  hide_project_coverage: false
