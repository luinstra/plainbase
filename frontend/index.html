<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>Plainbase</title>
    <script>
      // Pre-paint resolveDisplayMode twin: stored choice, then system, with light on system failure.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("pb-theme");
        } catch (e) {}
        var dark = stored === "dark";
        if (stored !== "light" && stored !== "dark") {
          try {
            dark = matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {
            dark = false;
          }
        }
        if (dark) document.documentElement.dataset.theme = "dark";
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
