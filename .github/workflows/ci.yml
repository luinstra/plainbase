name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- The release floor: universal JAR build + JVM test suite + spike ----
  # A native-image regression must NEVER fail this job (§6 Phase 0, task 5).
  build-test:
    name: Build + test (JVM, universal JAR floor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (backend + embedded frontend) and run tests
        run: ./gradlew build --console=plain

      - name: Generate Kover XML report
        run: ./gradlew koverXmlReport --console=plain

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: build/reports/kover/report.xml
          use_oidc: true

      - name: Run full-stack dependency spike on the JVM
        run: ./gradlew :server:run --args="spike" --console=plain

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: plainbase-jvm-dist
          path: server/build/distributions/

  # ---- Enforced-mode auth/CSRF gate (C1c): the JVM dist boots auth.mode=builtin on loopback
  # and the full auth/CSRF matrix runs against real sockets — closing the auth-off blind spot
  # (every other smoke here boots with auth.mode defaulting to off). ----
  enforced-auth-smoke:
    name: Enforced-mode auth/CSRF smoke (builtin, loopback)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: plainbase-jvm-dist
          path: dist

      - name: Unpack distribution
        run: |
          shopt -s nullglob
          tars=(dist/*.tar)
          [ ${#tars[@]} -eq 1 ] || { echo "expected exactly one dist tar, got: ${tars[*]:-none}" >&2; exit 1; }
          tar -xf "${tars[0]}" -C dist

      - name: Enforced builtin smoke
        run: |
          shopt -s nullglob
          bins=(dist/*/bin/plainbase)
          [ ${#bins[@]} -eq 1 ] || { echo "expected exactly one launcher, got: ${bins[*]:-none}" >&2; exit 1; }
          bash scripts/ci/enforced-auth-smoke.sh "${bins[0]}"

  # ---- Multi-root topology gate: the SAME binary-agnostic script the native gate runs, on the JVM
  # dist. The universal JAR is the release floor and a native failure blocks only the native artifact
  # — so a topology regression that reproduces on the JAR has to be able to paint the FLOOR red, and
  # a native-only leg cannot do that. (enforced-auth-smoke runs on both legs for the same reason.) ----
  multi-root-smoke:
    name: Multi-root topology smoke (JVM dist)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: plainbase-jvm-dist
          path: dist

      - name: Unpack distribution
        run: |
          shopt -s nullglob
          tars=(dist/*.tar)
          [ ${#tars[@]} -eq 1 ] || { echo "expected exactly one dist tar, got: ${tars[*]:-none}" >&2; exit 1; }
          tar -xf "${tars[0]}" -C dist

      - name: Multi-root topology smoke
        run: |
          shopt -s nullglob
          bins=(dist/*/bin/plainbase)
          [ ${#bins[@]} -eq 1 ] || { echo "expected exactly one launcher, got: ${bins[*]:-none}" >&2; exit 1; }
          bash scripts/ci/multi-root-smoke.sh "${bins[0]}"

  # ---- Docker image (compose tier) ----
  docker-image:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: plainbase:ci
          load: true

      - name: Smoke test image (health endpoint + SPA shell)
        run: |
          # The image binds DEFAULT_HOST=127.0.0.1 (secure-by-default, ADR-0008), which a published
          # port can't reach — so run the container as the local DEV tier: bind 0.0.0.0 with the
          # explicit PLAINBASE_INSECURE_HTTP override that clears the fail-closed bind guard. This is an
          # ephemeral localhost-only CI container; a real deployment is fronted by a TLS reverse proxy.
          docker run -d --name plainbase-smoke -p 8080:8080 \
            -e PLAINBASE_HOST=0.0.0.0 -e PLAINBASE_INSECURE_HTTP=true \
            -v "$PWD/fixtures/demo-docs:/content" plainbase:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1"
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          docker logs plainbase-smoke >plainbase-smoke.log 2>&1
          test -s plainbase-smoke.log
          while IFS= read -r line; do
            test -z "$line" || printf '%s\n' "$line" | jq -e . >/dev/null
          done <plainbase-smoke.log
          grep -q 'PLAINBASE_INSECURE_HTTP' plainbase-smoke.log
          docker rm -f plainbase-smoke

      # C1c: a published-port connection enters the container from the bridge gateway — a REAL
      # non-loopback socket peer — so this fires the 421 transport refusal and the full proxy
      # extraction/X-Forwarded-Host path the loopback smokes never can.
      - name: Enforced-mode transport + proxy smoke (non-loopback peer)
        run: bash scripts/ci/enforced-auth-docker-smoke.sh plainbase:ci

  # ---- Native gate (Phase 0, non-negotiable): build the native binary, run the
  # test suite AND the spike against it. Covers linux-x64; the platform matrix
  # grows by Phase 6. Failure here blocks the native ARTIFACT, never the JAR job.
  native-gate:
    name: Native gate (linux-x64)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      # GraalVM from the current line (25): native-image buildtools 1.x and its
      # reachability-metadata repository require it. Kotlin bytecode still
      # targets 21 via the Gradle toolchain — the native binary is built FROM
      # 21-targeted class files BY the GraalVM 25 compiler.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build native binary
        run: ./gradlew :server:nativeCompile --console=plain

      - name: Run test suite as native image
        run: ./gradlew :server:nativeTest --console=plain

      - name: Run full-stack dependency spike against the native binary (9/9 hard gate)
        run: ./server/build/native/nativeCompile/plainbase spike

      - name: Smoke test — native binary serves health endpoint with no JRE
        run: |
          CONTENT_DIR=fixtures/demo-docs DATA_DIR=/tmp/pb-data \
            ./server/build/native/nativeCompile/plainbase serve &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = "1"
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          kill $SERVER_PID

      # SecureRandom/SHA-256 is a named native divergence surface — prove enforced auth under the
      # native image too (same script, distinct port so a straggler from the previous step can't
      # collide; the script's fresh DATA_DIR avoids lock collisions).
      - name: Enforced builtin smoke (native binary)
        run: bash scripts/ci/enforced-auth-smoke.sh ./server/build/native/nativeCompile/plainbase 8081

      # C2 master criterion: native startup < 1 s — exec-to-first-200-/healthz, gated on the median
      # of 5 sequential restarts at ms granularity (the 1 s-granularity smoke above can't assert
      # this). Port 8082: the job already used 8080 (smoke) and 8081 (enforced smoke), and both
      # earlier servers have been killed by the time this step binds.
      #
      # Budget 2000 ms here is a CI regression TRIPWIRE, not the target: GitHub's shared runners are
      # ~2x slower than local (~467 ms local median → ~933 ms CI median, one run at 1004 ms), so
      # gating at 1000 ms would flake on ~67 ms of headroom. 2000 ms ≈ 2x the CI median. The <1 s
      # target stays enforced by the script's DEFAULT budget on local/production runs.
      - name: Native startup bound (regression tripwire, 2 s on shared runner; <1 s target is local)
        run: bash scripts/ci/native-startup-bound.sh ./server/build/native/nativeCompile/plainbase 8082 2000

      # The multi-root topology, end to end against the real binary: both config provenances, the
      # `plainbase root` refusals, a missing root's 503, and the detached-root WARN boot. Port 8083 —
      # every earlier server in this job (8080/8081/8082) has been killed by the time this one binds.
      - name: Multi-root topology smoke (native binary)
        run: bash scripts/ci/multi-root-smoke.sh ./server/build/native/nativeCompile/plainbase 8083

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: plainbase-linux-x64
          path: server/build/native/nativeCompile/plainbase

  # ---- Playwright smoke (C1c): deliberately OUTSIDE `./gradlew build` (hermetic-floor rationale,
  # frontend/build.gradle.kts) and a separate job so a browser-download/flake never paints the JAR
  # floor red. Boots ALL FOUR webServers (playwright.config.ts) — auth-off, enforced-builtin
  # (review.spec.ts approval flow), and the two multi-root installs: both-serving, and one whose
  # extra root's path is gone (the 503/outage surfaces) — and carries the C1a CSP zero-violation
  # gate (csp.spec.ts) into CI. ----
  frontend-smoke:
    name: Playwright smoke (open + enforced-builtin + multi-root, CSP gate)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Keyed on the lockfile: the browser revision is a function of the pinned @playwright/test
      # version. The task's own ensure-chromium.mjs sees the browser present on a warm cache and
      # skips the installer spawn entirely.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-chromium-

      # --with-deps apt-installs Chromium's system libraries (no Gradle task exists for that);
      # pinning npx to the package.json version guarantees the SAME browser build the tests expect.
      # The tests themselves still run under the Gradle-managed hermetic node.
      - name: Install Chromium + system deps
        run: npx --yes playwright@1.60.0 install --with-deps chromium

      - name: Playwright smoke (boots auth-off AND enforced-builtin servers)
        run: ./gradlew :frontend:smokeTest --console=plain
